<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FROGGY MATH JUMP - POND EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap');

        :root {
            --bg-color: #15a1d1;
            --primary: #05c46b;
            --danger: #ff3f34;
            --warning: #ffdd59;
            --ui-bg: rgba(255, 255, 255, 0.98);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b3d4d;
            font-family: 'Nunito', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(11, 61, 77, 0.8);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .hidden { display: none !important; }

        .panel {
            background: var(--ui-bg);
            padding: 30px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border: 10px solid #fff;
            max-width: 90%;
            width: 480px;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .frog-logo {
            width: 60px;
            height: 60px;
            animation: hop 0.8s infinite ease-in-out;
        }

        @keyframes hop {
            0%, 100% { transform: translateY(0) scaleX(1.1); }
            50% { transform: translateY(-20px) scaleX(0.9); }
        }

        .game-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: var(--primary);
            text-shadow: 3px 3px 0px #059653, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff, 1px 1px 0px #fff;
        }

        .input-name {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: 3px solid #f1f2f6;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            text-align: center;
            font-weight: 800;
            outline: none;
            transition: 0.3s;
        }

        .input-name:focus { border-color: var(--primary); }

        .setting-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .setting-label {
            font-weight: 800;
            color: #7f8c8d;
            margin-bottom: 6px;
            font-size: 0.85rem;
            display: block;
            text-align: center;
            text-transform: uppercase;
        }

        .selector {
            display: flex;
            gap: 8px;
            background: #f1f2f6;
            padding: 6px;
            border-radius: 18px;
        }

        .select-btn {
            flex: 1;
            padding: 10px;
            border-radius: 14px;
            border: none;
            font-family: 'Fredoka One', cursive;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            color: #7f8c8d;
        }

        .select-btn.active {
            background: white;
            color: #2d3436;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            font-size: 1.2rem;
            font-family: 'Fredoka One', cursive;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0px rgba(0,0,0,0.15);
            transition: 0.1s;
        }

        .btn-solo { background: linear-gradient(to bottom, #05c46b, #059653); }
        .btn-duel { background: linear-gradient(to bottom, #0fbcf9, #0984e3); }
        .btn-restart { background: #ff3f34; margin-top: 20px; }

        #topUI {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 150;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            background: white;
            border: 3px solid #1e272e;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0 #1e272e;
        }

        .sending-status {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="topUI">
        <button id="btnHome" class="icon-btn">🏠</button>
        <button id="btnAudio" class="icon-btn">🔊</button>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="panel">
            <div class="title-container">
                <img src="https://i.imgur.com/GvlmIVI.png" alt="Frog Logo" class="frog-logo">
                <div class="game-title">Froggy Math Jump</div>
            </div>
            
            <input type="text" id="playerName" class="input-name" placeholder="Masukkan Namamu..." maxlength="15">

            <div class="setting-group">
                <span class="setting-label">Tingkat Kesulitan</span>
                <div class="selector">
                    <button id="lvlEasy" class="select-btn active" onclick="setDifficulty('easy')">MUDAH </button>
                    <button id="lvlHard" class="select-btn" onclick="setDifficulty('hard')">SUSAH (× ÷)</button>
                </div>
            </div>

            <div class="setting-group">
                <span class="setting-label">Mode Waktu</span>
                <div class="selector">
                    <button id="modeChill" class="select-btn" onclick="setTimeMode('chill')">TANPA WAKTU</button>
                    <button id="modeChallenge" class="select-btn active" onclick="setTimeMode('challenge')">TANTANGAN</button>
                </div>
            </div>

            <button id="btnSolo" class="btn btn-solo" onclick="validateStart(1)">🎮 MAIN SOLO</button>
            <button id="btnDuel" class="btn btn-duel" onclick="validateStart(2)">⚔️ DUEL 1 VS 1</button>
        </div>
    </div>

    <div id="gameOver" class="overlay hidden">
        <div class="panel">
            <h1 style="font-family: 'Fredoka One'; font-size: 2.5rem; color: #ff3f34; margin-bottom: 15px; text-transform: uppercase;">Game Over</h1>
            <div id="winnerList" style="margin-bottom: 10px;"></div>
            <div id="sheetStatus" class="sending-status">Menyimpan skor ke cloud...</div>
            <button class="btn btn-restart" onclick="showMenu()">KEMBALI KE MENU</button>
        </div>
    </div>

<script>
/**
 * KONFIGURASI
 */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwBl4FWqe90ug3ExTr1piLvpzf2jTXs8dhHaxhP5YOhSOUi-oEw-IbVAeYMqgDUdrus/exec"; // Masukkan URL Apps Script Anda di sini

const frogImg = new Image();
frogImg.src = "https://i.imgur.com/GvlmIVI.png";

const koiImg = new Image();
koiImg.src = "https://i.imgur.com/I5tvXI4.png";

const AudioEngine = (() => {
    let ctx = null;
    let muted = false;
    const init = () => { if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if(ctx.state === 'suspended') ctx.resume(); };
    const tone = (f, t, d, v=0.1) => {
        if(muted || !ctx) return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, ctx.currentTime);
        g.gain.setValueAtTime(v, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + d);
    };
    return {
        init,
        playJump: () => tone(450, 'sine', 0.1, 0.05),
        playOk: (c=0) => { tone(600 + (c*20), 'sine', 0.1, 0.08); },
        playFail: () => tone(80, 'sawtooth', 0.6, 0.15),
        playWin: () => { [523, 659, 783, 1046].forEach((f,i) => setTimeout(() => tone(f, 'square', 0.4, 0.05), i*120)); },
        toggle: () => { muted = !muted; init(); return !muted; }
    };
})();

/**
 * POND ANIMATION
 */
class KoiFish {
    constructor(w, h) { this.cw = w; this.ch = h; this.reset(); }
    reset() {
        this.x = Math.random() * this.cw; this.y = Math.random() * this.ch;
        this.angle = Math.random() * Math.PI * 2; this.targetAngle = this.angle;
        this.velocity = 0.5 + Math.random(); this.size = 30 + Math.random() * 20;
        this.turnSpeed = 0.02; this.wiggling = 0; this.wiggleSpeed = 0.1;
    }
    update(playing) {
        if (Math.random() < 0.01) this.targetAngle += (Math.random() - 0.5) * Math.PI * 0.5;
        let diff = this.targetAngle - this.angle;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        this.angle += diff * this.turnSpeed;
        const baseSpeed = playing ? 1.5 : 0.8;
        this.x += Math.cos(this.angle) * this.velocity * baseSpeed;
        this.y += Math.sin(this.angle) * this.velocity * baseSpeed;
        if(this.x < -50) this.x = this.cw + 50; if(this.x > this.cw + 50) this.x = -50;
        if(this.y < -50) this.y = this.ch + 50; if(this.y > this.ch + 50) this.y = -50;
        this.wiggling += this.wiggleSpeed;
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle + Math.PI/2 + Math.sin(this.wiggling)*0.15);
        ctx.globalAlpha = 0.4;
        if(koiImg.complete) ctx.drawImage(koiImg, -this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
    }
}

class Ripple {
    constructor(x, y) { this.x = x; this.y = y; this.r = 0; this.alpha = 0.5; this.active = true; }
    update() { this.r += 2; this.alpha -= 0.015; if(this.alpha <= 0) this.active = false; }
    draw(ctx) {
        ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${this.alpha})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(this.x, this.y, this.r, this.r/2.5, 0, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
    }
}

/**
 * GAME CORE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameInstances = [];
let koiFish = [];
let ripples = [];
let isPlaying = false;
let lastTime = 0;
let timeGlobal = 0;

// Game Settings
let currentDifficulty = 'easy';
let currentTimeMode = 'challenge'; // 'chill' or 'challenge'
let currentUsername = "Pemain";

function setDifficulty(lvl) {
    currentDifficulty = lvl;
    document.getElementById('lvlEasy').classList.toggle('active', lvl === 'easy');
    document.getElementById('lvlHard').classList.toggle('active', lvl === 'hard');
}

function setTimeMode(mode) {
    currentTimeMode = mode;
    document.getElementById('modeChill').classList.toggle('active', mode === 'chill');
    document.getElementById('modeChallenge').classList.toggle('active', mode === 'challenge');
}

function validateStart(count) {
    const nameInput = document.getElementById('playerName').value.trim();
    if (nameInput === "") {
        document.getElementById('playerName').style.borderColor = "#ff3f34";
        return;
    }
    currentUsername = nameInput;
    startGame(count);
}

function genMath() {
    if (currentDifficulty === 'easy') {
        const n1 = Math.floor(Math.random() * 11) + 10; 
        const n2 = Math.floor(Math.random() * 8) + 2;   
        const ans = n1 * n2;
        let opts = [ans];
        while(opts.length < 4) {
            let w = ans + (Math.floor(Math.random() * 6) + 1) * (Math.random() > 0.5 ? 1 : -1);
            if(w > 0 && !opts.includes(w)) opts.push(w);
        }
        return { q: `${n1} × ${n2}`, a: ans, opts: opts.sort(() => Math.random() - 0.5) };
    } else {
        const n1 = Math.floor(Math.random() * 10) + 6;
        const n2 = Math.floor(Math.random() * 10) + 6;
        const ans = n1 * n2;
        let opts = [ans];
        while(opts.length < 4) {
            let w = ans + (Math.floor(Math.random() * 10) + 1) * (Math.random() > 0.5 ? 1 : -1);
            if(w > 0 && !opts.includes(w)) opts.push(w);
        }
        return { q: `${n1} × ${n2}`, a: ans, opts: opts.sort(() => Math.random() - 0.5) };
    }
}

class PlayerGame {
    constructor(id) {
        this.id = id;
        this.score = 0;
        this.isDead = false;
        this.frog = { x: 0, y: 0, jumping: false, p: 0, scale: 1 };
        this.leaves = [];
        this.question = null;
        this.timer = 10;
        this.maxTimer = 10;
    }
    setBounds(x, y, w, h) { this.bx = x; this.by = y; this.bw = w; this.bh = h; }
    reset() {
        this.baseX = this.bx + this.bw * 0.5;
        this.baseY = this.by + this.bh * 0.85;
        this.frog.x = this.baseX; this.frog.y = this.baseY;
        this.nextQuestion();
    }
    nextQuestion() {
        this.maxTimer = currentDifficulty === 'hard' ? 7 : 10;
        this.timer = this.maxTimer;
        this.question = genMath();
        this.leaves = [];
        const startY = this.by + this.bh * 0.35;
        const areaH = this.bh * 0.4;
        for(let i=0; i<4; i++) {
            this.leaves.push({
                x: this.bx + (this.bw * 0.3) + ((i % 2) * (this.bw * 0.4)),
                y: startY + (Math.floor(i / 2) * (areaH / 2)),
                val: this.question.opts[i],
                sway: Math.random() * Math.PI * 2
            });
        }
    }
    update(dt) {
        if(this.isDead) return;
        
        // Timer Logic
        if(currentTimeMode === 'challenge') {
            this.timer -= dt;
            if(this.timer <= 0) { this.isDead = true; AudioEngine.playFail(); }
        }

        if(this.frog.jumping) {
            this.frog.p += 0.12;
            if(this.frog.p >= 1) {
                this.frog.jumping = false; this.frog.scale = 1;
                ripples.push(new Ripple(this.frog.tx, this.frog.ty));
                if(this.frog.targetVal === this.question.a) {
                    this.score += 10; AudioEngine.playOk(this.score/10);
                    this.nextQuestion();
                } else { this.isDead = true; AudioEngine.playFail(); }
                this.frog.x = this.baseX; this.frog.y = this.baseY;
            } else {
                let p = this.frog.p;
                this.frog.x = this.frog.sx + (this.frog.tx - this.frog.sx) * p;
                this.frog.y = this.frog.sy + (this.frog.ty - this.frog.sy) * p - Math.sin(p * Math.PI) * 100;
                this.frog.scale = 1 + Math.sin(p * Math.PI) * 0.4;
            }
        }
    }
    draw(ctx) {
        ctx.save(); ctx.beginPath(); ctx.rect(this.bx, this.by, this.bw, this.bh); ctx.clip();
        if(this.isDead) { ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(this.bx, this.by, this.bw, this.bh); }
        
        const r = Math.min(32, this.bw * 0.28);
        const drawLeaf = (x, y, val, s) => {
            const sx = this.isDead ? 0 : Math.sin(timeGlobal + s) * 4;
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.arc(x+sx+4, y+4, r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = this.isDead ? '#95a5a6' : '#2ecc71'; ctx.beginPath(); ctx.arc(x+sx, y, r, 0.4, Math.PI*1.8); ctx.lineTo(x+sx, y); ctx.fill();
            if(val) {
                ctx.fillStyle = '#fff'; ctx.font = `900 ${r*0.8}px Nunito`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(val, x+sx, y);
            }
        };

        drawLeaf(this.baseX, this.baseY, null, 0);
        if(!this.isDead) this.leaves.forEach(l => drawLeaf(l.x, l.y, l.val, l.sway));

        ctx.save(); ctx.translate(this.frog.x, this.frog.y);
        if(this.isDead) ctx.scale(1, -1); else ctx.scale(this.frog.scale, this.frog.scale);
        const fSize = r * 2.2;
        if(frogImg.complete) ctx.drawImage(frogImg, -fSize/2, -fSize/2, fSize, fSize);
        ctx.restore();

        if(!this.isDead) {
            ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.min(20, this.bw*0.1)}px Nunito`; ctx.textAlign = 'center';
            ctx.fillText(`${gameInstances.length > 1 ? 'P'+this.id : currentUsername}: ${this.score}`, this.bx + this.bw/2, this.by + 35);
            
            const qW = this.bw * 0.8; const qH = 50; const qX = this.bx + (this.bw - qW)/2;
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.roundRect(qX, this.by + 60, qW, qH, 12); ctx.fill();
            ctx.fillStyle = '#2c3e50'; ctx.font = `900 ${Math.min(24, this.bw*0.15)}px Fredoka One`;
            ctx.fillText(this.question.q, this.bx + this.bw/2, this.by + 60 + qH/2 + 8);

            if(currentTimeMode === 'challenge') {
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(qX, this.by + 60 + qH + 5, qW, 6);
                ctx.fillStyle = this.timer < 3 ? '#ff3f34' : '#2ecc71';
                ctx.fillRect(qX, this.by + 60 + qH + 5, qW * (this.timer/this.maxTimer), 6);
            }
        }
        ctx.restore();
    }
}

function startGame(count) {
    AudioEngine.init();
    gameInstances = Array.from({length: count}, (_, i) => new PlayerGame(i+1));
    isPlaying = true; timeGlobal = 0; 
    resize();
    document.getElementById('mainMenu').classList.add('hidden');
    document.getElementById('gameOver').classList.add('hidden');
    lastTime = performance.now();
}

function loop(t) {
    const dt = (t - lastTime)/1000; lastTime = t; timeGlobal += dt;
    ctx.fillStyle = '#15a1d1'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ripples.forEach(r => { r.update(); r.draw(ctx); }); ripples = ripples.filter(r => r.active);
    koiFish.forEach(k => { k.update(isPlaying); k.draw(ctx); });
    if(isPlaying) {
        let alive = 0;
        gameInstances.forEach(g => { g.update(dt); g.draw(ctx); if(!g.isDead) alive++; });
        if(alive === 0) { isPlaying = false; setTimeout(endGame, 800); }
    }
    requestAnimationFrame(loop);
}

async function sendToGoogleSheets(name, score) {
    if(!WEB_APP_URL) return;
    const status = document.getElementById('sheetStatus');
    status.innerText = "Mengirim skor ke cloud...";
    try {
        await fetch(WEB_APP_URL, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nama: name, skor: score, mode: currentTimeMode, level: currentDifficulty, tanggal: new Date().toLocaleString() })
        });
        status.innerText = "✅ Skor tersimpan!";
    } catch(e) { status.innerText = "❌ Gagal menyimpan skor."; }
}

function endGame() {
    const list = document.getElementById('winnerList');
    const sorted = [...gameInstances].sort((a,b)=>b.score - a.score);
    list.innerHTML = sorted.map((p,i)=>`
        <div style="background:#f1f2f6; padding:12px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; font-weight:900;">
            <span>${i===0?'🏆':''} ${gameInstances.length > 1 ? 'Pemain '+p.id : currentUsername}</span>
            <span>${p.score}</span>
        </div>
    `).join('');
    document.getElementById('gameOver').classList.remove('hidden');
    AudioEngine.playWin();
    sendToGoogleSheets(currentUsername, sorted[0].score);
}

function showMenu() {
    isPlaying = false;
    document.getElementById('mainMenu').classList.remove('hidden');
    document.getElementById('gameOver').classList.add('hidden');
}

function resize() {
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    if(koiFish.length === 0) koiFish = Array.from({length: 10}, () => new KoiFish(canvas.width, canvas.height));
    if(isPlaying) {
        gameInstances.forEach((g, i) => {
            const w = canvas.width / gameInstances.length;
            g.setBounds(i * w, 0, w, canvas.height);
            g.reset();
        });
    }
}

window.addEventListener('resize', resize);
canvas.addEventListener('touchstart', e => {
    if(!isPlaying) return;
    Array.from(e.changedTouches).forEach(t => {
        gameInstances.forEach(g => {
            const r = Math.min(30, g.bw * 0.35);
            let hit = g.leaves.find(l => Math.hypot(t.clientX - l.x, t.clientY - l.y) < r + 20);
            if(hit && !g.frog.jumping && !g.isDead) {
                g.frog.jumping = true; g.frog.p = 0; g.frog.sx = g.frog.x; g.frog.sy = g.frog.y;
                g.frog.tx = hit.x; g.frog.ty = hit.y; g.frog.targetVal = hit.val;
                ripples.push(new Ripple(g.frog.x, g.frog.y)); AudioEngine.playJump();
            }
        });
    });
});

canvas.addEventListener('mousedown', e => {
    if(!isPlaying) return;
    gameInstances.forEach(g => {
        const r = Math.min(30, g.bw * 0.35);
        let hit = g.leaves.find(l => Math.hypot(e.clientX - l.x, e.clientY - l.y) < r + 20);
        if(hit && !g.frog.jumping && !g.isDead) {
            g.frog.jumping = true; g.frog.p = 0; g.frog.sx = g.frog.x; g.frog.sy = g.frog.y;
            g.frog.tx = hit.x; g.frog.ty = hit.y; g.frog.targetVal = hit.val;
            ripples.push(new Ripple(g.frog.x, g.frog.y)); AudioEngine.playJump();
        }
    });
});

document.getElementById('btnHome').onclick = showMenu;
document.getElementById('btnAudio').onclick = (e) => { e.target.innerText = AudioEngine.toggle() ? "🔊" : "🔇"; };

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
